    "native-skia",
    "skia-safe/gl",
]
native-skia-metal = [
    "native-skia",
    "skia-safe/ganesh",
    "skia-safe/metal",
]
pdf-icc = [
    "pdf-import",
    "pdf_oxide/icc-qcms",
]
pdf-import = [
    "dep:pdf_oxide",
    "pdf_oxide/legacy-crypto",
    "dep:office_oxide",
    "dep:tiny-skia",
]
pdf-jbig2 = [
    "pdf-import",
    "pdf_oxide/jbig2",
]
pdf-jpeg2000 = [
    "pdf-import",
    "pdf_oxide/jpeg2000",
]
subsecond-dev = ["dep:subsecond"]
wasm-api = []

[lib]
name = "rhwp"
crate-type = [
    "rlib",
    "cdylib",
]
path = "src/lib.rs"

[[bin]]
name = "rhwp"
path = "src/main.rs"
required-features = ["wasm-api"]

[[bin]]
name = "rhwp-q"
