repository = "https://github.com/edwardkim/rhwp"

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[features]
default = [
    "console_error_panic_hook",
    "pdf-import",
    "pdf-jbig2",
    "pdf-jpeg2000",
    "pdf-icc",
    "wasm-api",
]
dev-tools = []
native-skia = [
    "dep:skia-safe",
    "dep:icy_sixel",
]
native-skia-d3d = [
    "native-skia",
    "skia-safe/d3d",
    "dep:windows",
]
